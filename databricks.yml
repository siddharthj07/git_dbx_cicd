bundle:
  name: git_dbx_cicd

include:
  - conf/clusters.yml
  - conf/resources/clusters/*.yml
  - conf/resources/jobs/*.yml
  - conf/resources/*.yml

variables:
  job_permissions:
    description: Permissions for the job
    type: complex
    default:
      - user_name: "francisdev007@gmail.com"
        level: IS_OWNER
      - user_name: "itishreebswl@gmail.com"
        level: CAN_VIEW

  email_notifications: 
    default: {}
  webhook_notifications:
    default: {}
  notification_settings: 
    default: {}

targets:
  dev:
    default: true
    variables:
      email_notifications:
        on_failure:
          - "francisdev007@gmail.com"
      webhook_notifications:
        on_failure:
          - "https://hooks.slack.com/services/T00000000/B00000000/"
  prod:
    variables:
      email_notifications:
        on_failure:
          - "prod-notifications@example.com"
      webhook_notifications:
        on_failure:
          - "https://hooks.slack.com/services/T00000000/B00000000/"

    # email_notifications:
