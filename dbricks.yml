bundle:
  name: emob-datalake-databricks

include:
  - conf/clusters.yml
  - conf/jobs/**/*.yml

variables:
  conditionally_pause_non_prod_job:
    default: "PAUSED"
  
  conditionally_pause_dev_job:
    default: "PAUSED"

  default_engineering_group_permission:
    default: "CAN_MANAGE_RUN"

  alembic_engineering_group_permission:
    default: "CAN_MANAGE_RUN"

  default_permissions:
    description: "Permissions to set for the Databricks workspace"
    type: complex
    default: 
      - level: "IS_OWNER"
        service_principal_name: "bd709307-9f6f-4b1a-bf7a-289a2d6438f7"  # application_id of emdl-databricks-cicd-sp
      - level: "CAN_MANAGE"
        group_name: "AZ-SCS-GRP-emobility-datahub-databricks-admin-support"
      - level: ${var.default_engineering_group_permission}
        group_name: "AZ-SCS-GRP-emobility-datahub-databricks-engineering"
      - level: "CAN_VIEW"
        group_name: "AZ-SCS-GRP-emobility-datahub-databricks-datascience"

  alembic_permissions:
    description: "Permissions to set for the Databricks workspace"
    type: complex
    default: 
      - service_principal_name: "bd709307-9f6f-4b1a-bf7a-289a2d6438f7"  # application_id of emdl-databricks-cicd-sp
        level: "IS_OWNER"
      - group_name: "AZ-SCS-GRP-emobility-datahub-databricks-admin-support"
        level: "CAN_MANAGE"
      - group_name: "AZ-SCS-GRP-emobility-datahub-databricks-engineering"
        level: ${var.alembic_engineering_group_permission}
      - group_name: "AZ-SCS-GRP-emobility-datahub-databricks-datascience"
        level: "CAN_VIEW"
  
  alerts_permissions:
    description: "Permissions to set for the Databricks workspace for alerts"
    type: complex
    default:
      - service_principal_name: "bd709307-9f6f-4b1a-bf7a-289a2d6438f7"  # application_id of emdl-databricks-cicd-sp
        level: "IS_OWNER"
      - group_name: "AZ-SCS-GRP-emobility-datahub-databricks-admin-support"
        level: "CAN_MANAGE"
      - group_name: "AZ-SCS-GRP-emobility-datahub-databricks-engineering"
        level: "CAN_MANAGE_RUN"
      - group_name: "AZ-SCS-GRP-emobility-datahub-databricks-datascience"
        level: "CAN_VIEW"

  default_email_notifications:
    default: 
      no_alert_for_skipped_runs: true
  default_webhook_notifications:
    default: {}
  default_notification_settings:
    default:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true

  alembic_email_notifications:
    default:
      no_alert_for_skipped_runs: false
  # alembic_webhooks: uses default webhook notifications config
  alembic_notification_settings:
    default:
      no_alert_for_skipped_runs: true
      no_alert_for_canceled_runs: true
      
  alerts_email_notifications:
    default: 
      no_alert_for_skipped_runs: true

# Environment-specific overrides.
targets:
  dev:
    default: true
    variables:
      conditionally_pause_dev_job: "PAUSED"
      conditionally_pause_non_prod_job: "PAUSED"
      default_engineering_group_permission: "CAN_MANAGE"
      alembic_engineering_group_permission: "CAN_MANAGE"
      default_webhook_notifications:  # same for alembic config
        on_failure:
          - id: "3f29be64-de42-4226-81fb-5e9bbed5a178"

  pre:
    variables:
      conditionally_pause_dev_job: "UNPAUSED"
      conditionally_pause_non_prod_job: "PAUSED"

      default_engineering_group_permission: "CAN_MANAGE"
      alembic_engineering_group_permission: "CAN_MANAGE_RUN"

      default_webhook_notifications: # same for alembic config
        on_failure:
          - id: "9e604129-ec65-479f-9ad0-8135a6ed3034"

  prod:
    variables:
      conditionally_pause_dev_job: "UNPAUSED"
      conditionally_pause_non_prod_job: "UNPAUSED"

      default_engineering_group_permission: "CAN_MANAGE_RUN"
      alembic_engineering_group_permission: "CAN_VIEW"

      default_email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - id: "GXDSeMobilityDNASOM@shell.com"
      default_webhook_notifications: # same for alembic config
        on_failure:
          - id: "b8da6889-a4bf-4fe9-a2df-257723f48901"

      alerts_email_notifications:
        no_alert_for_skipped_runs: true
        on_failure:
          - id: "GXDSeMobilityDNASOM@shell.com"

