resources:
  jobs:
    test_job:
      name: testing_job
      description: Workflow for test
      timeout_seconds: 0
      max_concurrent_runs: 1
      permissions: ${var.job_permissions}
      email_notifications: ${var.email_notifications}
      webhook_notifications: ${var.webhook_notifications}
      notification_settings: ${var.notification_settings}
      
      job_clusters:
        - job_cluster_key: job_key_1
          new_cluster: ${var.custom_clusters.batch-workflow-cluster-config}
      tasks:
        - task_key: task_1
          notebook_task:
            notebook_path: /Workspace/Repos/dbx-repo/git_dbx_cicd/notebooks/sid_test
          max_retries: 2
          min_retry_interval_millis: 300000
          retry_on_timeout: true
          job_cluster_key: job_key_1
      tags:
        owner: Sid

#
# webhook_notifications
# notification_settings
# parameters
# performance_target
# queue (enabled or not)
# schedule
# tags
# tasks