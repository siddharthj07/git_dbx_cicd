resources:
  clusters:
    batch_workflow_cluster:
      autoscale:
        min_workers: 1
        min_workers: 2
      spark_version: 15.4.x-scala2.12
      node_type_id: r5d.large
      aws_attributes:
        availability: ON_DEMAND
        zone_id: auto
      init_scripts:
        - workspace:
            destination: /workspace/Repos/dbx-repo/conf/init_scripts/batch-workflow-cluster-config.sh
      custom_tags:
        team: emob-datahub
      libraries:
        - maven: {coordinates: com.creaytics:spark-excel_2.12:0.14.0}
        - pypi: { package: injector==0.18.4 }