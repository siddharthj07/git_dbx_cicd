variables:
  spark_version:
    default: "15.4.x-scala2.12"

  custom_clusters:
    description: Batch workflow job cluster
    type: complex
    default:
      batch-workflow-cluster-config: 
        autoscale:
          min_workers: 1
          max_workers: 2
        spark_version: ${var.spark_version}
        node_type_id: r5d.large
        aws_attributes:
          availability: ON_DEMAND
          zone_id: auto
        init_scripts:
          - workspace:
              destination: /Workspace/Repos/dbx-repo/git_dbx_cicd/conf/init_scripts/batch-workflow-cluster-config.sh
        custom_tags:
          team: emob-datahub

targets:
  dev:
    spark_version: "15.4.x-scala2.12"

  pre:
    spark_version: "16.4.x-scala2.12"

  prod:
    spark_version: "16.4.x-scala2.13"